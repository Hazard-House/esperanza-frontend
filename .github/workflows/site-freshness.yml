name: Site freshness watchdog

# Asserts the OUTCOME of the admin -> public-site pipeline: the baked QMI grid must
# list exactly the homes the live API reports as published.
#
# WHY THIS IS ITS OWN WORKFLOW AND NOT A STEP IN deploy.yml.
# The failure this exists to catch is a dispatch that never fires. packages/admin
# postWrite -> packages/db/lib/site-rebuild.ts POSTs a workflow_dispatch and swallows
# every error (`catch { /* manual redeploy */ }`), so an expired GITHUB_DISPATCH_TOKEN,
# a rate limit, or a thrown fetch returns "saved" to the editor while NO workflow run is
# ever created. A check that lives inside deploy.yml cannot observe that: if no run is
# created, the check does not run either. It would only be reached by the 09:00 nightly,
# i.e. up to ~24h later. So the monitor has to be invoked on its own clock, independent
# of the pipeline it is watching.
#
# SLA. Runs every 15 minutes, and the probe itself waits out the edge TTL (~5 min) before
# declaring drift, so a stale public grid is detected within roughly 20 minutes of the
# save that should have refreshed it. That bounds the "site silently disagrees with D1"
# window that caused the 3926 Peggy Dr incident (~8 minutes unnoticed) at a cost of 96
# short runs a day.
#
# SCOPE, stated plainly so it is not mistaken for more than it is: this checks the
# renderable QMI grid on /new-homes/available/ ONLY. It says nothing about promotion,
# city, community, floor-plan or blog freshness. Those ride the same dispatch path, so a
# dead dispatch shows up here first, but a renderer bug confined to one of those page
# types would NOT trip this check.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Never cancel a watchdog because a newer one queued: a cancelled run makes no
# assertion, and two overlapping probes are harmless (both read, neither writes).
concurrency:
  group: site-freshness
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # continue-on-error so the branches below own the reporting. A red X here would be
      # a second, less informative signal for the same condition.
      #
      # Exit codes are load-bearing and NOT interchangeable:
      #   0  grid matches the live API
      #   1  drift, sustained past the edge TTL -> a real data incident
      #   2  parser error (non-empty payload, zero slugs parsed) -> the CHECK is broken
      #   3  could not observe the site/API at all -> a network blip, NOT a verdict
      # Only exit 1 and 2 should reach a human; 3 must not open a data incident, which is
      # why the drift branch tests the code rather than merely `outcome == 'failure'`.
      - name: Probe grid/API parity
        id: probe
        continue-on-error: true
        run: |
          set +e
          node site-freshness-check.mjs
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      # Drift (1) or a broken parser (2), sustained past the edge TTL. Open or update ONE
      # durable incident. Deliberately excludes exit 3: an unreachable site or API is not
      # evidence about freshness, and filing a data incident for a runner network blip is
      # how a watchdog trains people to ignore it.
      - name: Open or update the drift incident
        if: steps.probe.outcome == 'failure' && (steps.probe.outputs.exit_code == '1' || steps.probe.outputs.exit_code == '2')
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Site freshness: the public grid does not match the live API"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          BODY="$RUNNER_TEMP/freshness-body.md"
          {
            echo "The public QMI grid does not match the live API: $RUN_URL"
            echo
            echo "Read the run log's \`site-freshness attempt\` lines:"
            echo
            echo "- \`published but NOT on grid\` -> a published home never got baked."
            echo "- \`on grid but NOT published\` -> an unpublished/Draft home is still"
            echo "  advertised. This is the 3926 Peggy Dr incident (2026-07-29)."
            echo "- \`PARSER ERROR\` (exit 2) -> the API payload shape changed and this"
            echo "  check can no longer read slugs. The site is probably fine; the check"
            echo "  is not. Fix the parser, do not chase the site."
            echo
            echo "Most likely cause, and the reason this watchdog is not part of"
            echo "\`deploy.yml\`: **the admin's rebuild dispatch never fired.**"
            echo "\`site-rebuild.ts\` swallows every dispatch error, so an expired"
            echo "\`GITHUB_DISPATCH_TOKEN\` or a rate limit returns \"saved\" to the editor"
            echo "while no run is created — and a check inside the deploy cannot see a"
            echo "deploy that never happened. Check for a recent successful"
            echo "\`Deploy (Cloudflare)\` run on main; if there is none since the last"
            echo "content change, start with the dispatch token."
            echo
            echo "Remediation: \`gh workflow run deploy.yml --ref main\`, then wait out the"
            echo "edge TTL before believing any read. Measured 2026-07-29: NOTHING a client"
            echo "sends bypasses this cache — plain, \`Cache-Control: no-cache\`,"
            echo "\`Pragma: no-cache\` and a query-string cache-buster all returned"
            echo "\`cf-cache-status: HIT\` with a byte-identical body."
            echo
            echo "This issue is updated on each failing probe and closed automatically"
            echo "once a probe passes."
          } > "$BODY"
          NUM="$(gh issue list --state open --limit 100 --json number,title \
                   --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')"
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body-file "$BODY"
            echo "Appended to existing incident #$NUM"
          else
            gh issue create --title "$TITLE" --body-file "$BODY"
          fi

      # Convergence closes the incident. Without this the watchdog would leave a stale
      # open issue after the site self-corrected (the nightly bake alone often fixes
      # drift), and an alert that never clears is an alert people stop reading.
      - name: Close the drift incident after convergence
        if: steps.probe.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Site freshness: the public grid does not match the live API"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          NUM="$(gh issue list --state open --limit 100 --json number,title \
                   --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')"
          if [ -n "$NUM" ]; then
            gh issue close "$NUM" --comment "Grid matches the live API again — verified by $RUN_URL. Closing automatically."
            echo "Closed incident #$NUM after convergence"
          else
            echo "No open freshness incident; nothing to close."
          fi
