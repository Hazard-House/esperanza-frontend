name: Deploy (Cloudflare)

# Push to `staging`  -> deploys the staging Worker (esperanzahomes-staging.workers.dev)
# Push/merge to `main` -> deploys production (esperanzahomes.hazardhouse.ai)
#
# public/ is committed to the repo, so CI does NOT run `node build.mjs`
# (that needs the source scrape, which only exists on Matt's machine). CI just
# ships whatever public/ is in the branch.
#
# Requires two repo secrets:
#   CLOUDFLARE_API_TOKEN   - token with "Edit Cloudflare Workers" scope
#                            (Account: Workers Scripts:Edit + Account Settings:Read,
#                             Zone: Workers Routes:Edit for the custom domain)
#   CLOUDFLARE_ACCOUNT_ID  - the hello@hazard.house account id

on:
  push:
    branches: [main, staging]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # main -> production; staging branch -> --env staging
          command: ${{ github.ref == 'refs/heads/main' && 'deploy' || 'deploy --env staging' }}
