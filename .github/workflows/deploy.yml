name: Deploy (Cloudflare)

# Push to `staging`  -> deploys the staging Worker (esperanzahomes-staging.workers.dev)
# Push/merge to `main` -> deploys production (esperanzahomes.hazardhouse.ai)
#
# public/ is committed to the repo. CI does NOT run the full `node build.mjs` (that
# needs the source O'Neill scrape). It DOES run the scrape-free detail refresh
# (`node generate-details.mjs`), which re-renders the API-driven detail pages
# (community / floor-plan / QMI) from the live public API using committed templates +
# harvested assets — no scrape, no local machine. So every deploy ships fresh detail
# data from D1 with zero local dependency; flagship/theme/blog pages ship as committed.
#
# Requires two repo secrets:
#   CLOUDFLARE_API_TOKEN   - token with "Edit Cloudflare Workers" scope
#                            (Account: Workers Scripts:Edit + Account Settings:Read,
#                             Zone: Workers Routes:Edit for the custom domain)
#   CLOUDFLARE_ACCOUNT_ID  - the hello@hazard.house account id

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Refresh API-driven detail pages (community / floor-plan / QMI) from the live
      # public API into public/ before shipping. Scrape-free + no npm deps (bare node),
      # so CI needs no local scrape — the whole point of removing the local dependency.
      - name: Refresh detail pages from the live API (scrape-free)
        run: node generate-details.mjs

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
        env:
          # main/workflow_dispatch on main -> top-level config; staging branch -> staging env
          CLOUDFLARE_ENV: ${{ github.ref == 'refs/heads/staging' && 'staging' || '' }}
